name: Diagnose Foundation 1.2.1 compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/foundation-121-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install current locked baseline
        run: npm ci
      - name: Capture baseline TypeScript errors
        run: |
          npm run lint > baseline-typescript.log 2>&1 || true
          cat baseline-typescript.log
      - name: Test Foundation 1.2.1 without changing tracked files
        run: |
          npm pkg set 'dependencies.@dolomitinordicski/dns-shared-data=github:dolomitinordicski/dns-shared-data#foundation-v1.2.1'
          npm install --package-lock-only
          npm ci
          npm run lint > target-typescript.log 2>&1 || true
          cat target-typescript.log
      - name: Summarize compiler diagnostics
        if: always()
        shell: bash
        run: |
          echo "### Flyer Studio Foundation typecheck comparison" >> "$GITHUB_STEP_SUMMARY"
          for name in baseline target; do
            file="${name}-typescript.log"
            echo "#### ${name}" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$file" ]; then
              echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
              grep -E 'error TS[0-9]+' "$file" | head -60 >> "$GITHUB_STEP_SUMMARY" || echo 'No TypeScript errors' >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
              echo "error count: $(grep -cE 'error TS[0-9]+' "$file" || true)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Diagnostic did not finish' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload comparison logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyer-foundation-121-typecheck
          path: |
            baseline-typescript.log
            target-typescript.log
